[package]
name = "ouch-decompress-gui"
version = "0.4.1"
edition = "2021"
rust-version = "1.95"
description = "A lightweight GUI to extract archives on Linux, powered by ouch."
authors = ["Alarez777"]
license = "MIT"
repository = "https://github.com/Alarez777/Ouch-Decompress-Gui"
keywords = ["archive", "decompress", "extract", "ouch", "gui"]
categories = ["gui", "compression"]

[[bin]]
name = "ouch-decompress-gui"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "x11",
    "wayland",
    "default_fonts",
] }
egui = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"

# GNOME/Adwaita-style client-side decorations on Wayland, so the window
# titlebar matches native GNOME apps.
winit = { version = "0.30.13", default-features = false, features = [
    "wayland-csd-adwaita",
    "wayland-dlopen",
] }

# Lints from the BeautifulRust guide (https://github.com/morganlinton/BeautifulRust),
# adapted to a binary crate. Warning groups (`all`, `pedantic`) are added later;
# `unreachable_pub` is omitted because every `pub` item in a binary is
# unreachable from outside, so it would flag the whole crate.
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
unwrap_used = "warn"
expect_used = "allow"
panic_in_result_fn = "warn"
missing_assert_message = "warn"

# Suppressions must explain themselves and expire when no longer needed.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

# Unsafe must be justified.
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"

# API shape.
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
rc_buffer = "warn"

# Evolution.
exhaustive_enums = "warn"

# Idioms.
string_add = "warn"
wildcard_imports = "warn"

# Debugging leftovers.
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

# Casts that silently lose information.
as_conversions = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
