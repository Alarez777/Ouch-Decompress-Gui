name: Release

# Builds the AppImages only when a tag like `v0.2.0` is pushed.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build AppImage (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        # An AppImage links against the glibc of the machine that builds it, and
        # `ubuntu-latest` is now Ubuntu 26.04 (glibc 2.43), which does not run on
        # current distros. Keep the images and `max_glibc` in sync.
        include:
          - os: ubuntu-22.04
            arch: x86_64
            max_glibc: GLIBC_2.35
          - os: ubuntu-22.04-arm
            arch: aarch64
            max_glibc: GLIBC_2.35
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-cargo-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils curl ca-certificates file desktop-file-utils zsync

      - name: Test
        run: cargo test --release --locked

      - name: Build AppImage
        env:
          # appimagetool embeds this version in the AppImage.
          VERSION: ${{ github.ref_name }}
        run: |
          export VERSION="${VERSION#v}"
          bash packaging/build-appimage.sh "${{ matrix.arch }}"

      - name: Check the AppImage
        run: |
          appimage="$(ls dist/*.AppImage)"
          APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --version

          # Every bundled ELF must run on the oldest glibc we support, not just
          # the main binary: linuxdeploy copies libraries from the runner too.
          max_glibc="$(
            find dist/Ouch-Decompress-Gui.AppDir -type f \
              \( -path '*/usr/bin/*' -o -name '*.so' -o -name '*.so.*' \) \
              -exec objdump -T {} + 2>/dev/null \
              | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1
          )"
          echo "highest required: $max_glibc"
          newest="$(printf '%s\n%s\n' "${{ matrix.max_glibc }}" "$max_glibc" | sort -V | tail -1)"
          if [ "$newest" != "${{ matrix.max_glibc }}" ]; then
            echo "::error::the AppImage requires $max_glibc, newer than ${{ matrix.max_glibc }}"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ouch-Decompress-Gui-${{ matrix.arch }}
          path: |
            dist/*.AppImage
            dist/*.zsync
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download AppImages
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Uses the section of CHANGELOG.md that matches the pushed tag.
      - name: Build release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release_notes.md

          previous="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$previous" ]; then
            printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
              "$GITHUB_REPOSITORY" "$previous" "$GITHUB_REF_NAME" >> release_notes.md
          fi

          cat release_notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.AppImage
            artifacts/*.zsync
          body_path: release_notes.md
          generate_release_notes: false
          fail_on_unmatched_files: true
