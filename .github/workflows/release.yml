name: Release

# Builds the AppImage only when a tag like `v0.1.0` is pushed to main.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  appimage:
    name: AppImage (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-cargo-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl ca-certificates file desktop-file-utils zsync

      - name: Test
        run: cargo test --release --locked

      - name: Build AppImage
        env:
          # appimagetool embeds this version in the AppImage.
          VERSION: ${{ github.ref_name }}
        run: |
          export VERSION="${VERSION#v}"
          bash packaging/build-appimage.sh "${{ matrix.arch }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ouch-Decompress-Gui-${{ matrix.arch }}
          path: dist/*.AppImage
          if-no-files-found: error

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.AppImage
          generate_release_notes: true
